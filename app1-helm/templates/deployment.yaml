apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name}}-deploy 
  namespace: {{ .Values.app.namespace}}
spec: 
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
spec:
  containers:
    - name: nginx-container
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

      resources:
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"

      ports:
        - containerPort: 80

      volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html

  volumes:
    - name: html
      configMap:
        name: {{ .Release.Name }}-config